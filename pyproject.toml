[project]
name = "usj-ticket-prices"
version = "0.1.0"
description = "Tracks the published prices of Universal Studios Japan tickets over time"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "aws-cdk-lib>=2.200,<3",
    "boto3>=1.40",
    "constructs>=10.4,<11",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usj_ticket_prices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
